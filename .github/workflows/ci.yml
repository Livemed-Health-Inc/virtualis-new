name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: an unpinned runtime can change the tested and built
          # artifact with no change to this repository.
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Dependency audit
        run: bun audit --audit-level=high
